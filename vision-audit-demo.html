<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>多模态视觉智能质检 - HNXX印务</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Core Styles -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    
    <style>
      /* Custom Dashboard Styles for the Minimalist Light Theme */
      body { background-color: var(--bg-primary); }
      .dashboard-container { max-width: 1600px; margin: 0 auto; padding: 20px; height: calc(100vh - 65px); display: flex; flex-direction: column; gap: 20px; }
      
      .top-header { background: var(--bg-card); border-radius: var(--radius-xl); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); border: 1px solid var(--border-subtle); }
      .status-badge { background: #F6FFED; border: 1px solid #B7EB8F; color: #389E0D; padding: 6px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px;}
      .status-badge.warning { background: #FFF2E8; border: 1px solid #FFBB96; color: var(--accent-amber); }
      
      .metric-box { text-align: center; }
      .metric-value { font-family: var(--font-mono); font-size: 28px; font-weight: 700; color: var(--accent-blue); line-height: 1.2; }
      .metric-label { font-size: 13px; color: var(--text-muted); font-weight: 500; }

      .main-grid { display: grid; grid-template-columns: 320px 1fr 380px; gap: 24px; flex: 1; min-height: 0; }
      
      .panel { background: var(--bg-card); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); border: 1px solid var(--border-subtle); display: flex; flex-direction: column; overflow: hidden; }
      .panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border-subtle); font-weight: 700; display: flex; justify-content: space-between; align-items: center; color: var(--text-primary); }
      .panel-body { flex: 1; overflow-y: auto; padding: 20px; }

      /* Center: Vision Viewport */
      .vision-viewport { flex: 1; background: var(--bg-secondary); position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 8px solid var(--bg-card); border-radius: 0 0 var(--radius-xl) var(--radius-xl);}
      .vision-track { position: absolute; top: -100%; bottom: 0; width: 65%; background: #ffffff; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0,0,0,0.03); }
      
      /* Simulating the fast-moving printed sheets */
      .print-sheet { width: 100%; height: 50%; border-bottom: 2px dashed rgba(0, 59, 115, 0.1); position: relative; 
        background-image: 
          repeating-linear-gradient(45deg, rgba(0,0,0,0.01) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.01) 75%, rgba(0,0,0,0.01)), 
          repeating-linear-gradient(45deg, rgba(0,0,0,0.01) 25%, #ffffff 25%, #ffffff 75%, rgba(0,0,0,0.01) 75%, rgba(0,0,0,0.01)); 
        background-size: 40px 40px; 
      }
      
      .scan-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--accent-blue); box-shadow: 0 0 15px var(--accent-blue); z-index: 10; top: 10%; animation: scan 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate; opacity: 0.8; }
      
      @keyframes scan { 0% { top: 5%; } 100% { top: 95%; } }
      @keyframes moveBelt { 0% { transform: translateY(0); } 100% { transform: translateY(50%); } }

      .bounding-box { position: absolute; border: 2px solid var(--accent-red); background: rgba(200, 16, 46, 0.08); display: flex; align-items: flex-start; justify-content: center; animation: pulse-box 0.4s alternate infinite; z-index: 20; box-shadow: inset 0 0 10px rgba(200, 16, 46, 0.1);}
      .bounding-label { background: var(--accent-red); color: white; font-size: 12px; padding: 3px 8px; position: absolute; top: -24px; left: -2px; white-space: nowrap; font-weight: 700; border-radius: 4px 4px 4px 0; letter-spacing: 0.5px;}
      @keyframes pulse-box { from { border-color: rgba(200, 16, 46, 0.4); } to { border-color: rgba(200, 16, 46, 1); box-shadow: 0 0 15px rgba(200, 16, 46, 0.3); } }

      /* Left: Logs */
      .log-item { padding: 14px 20px; border-bottom: 1px solid var(--border-subtle); font-size: 13px; font-family: var(--font-mono); line-height: 1.5; animation: slideIn 0.3s ease-out; }
      @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
      .log-item.normal { color: var(--text-secondary); }
      .log-item.alert { background: #FFF1F0; border-left: 4px solid var(--accent-red); color: var(--text-primary); }
      .log-item.learning { background: rgba(0, 59, 115, 0.04); border-left: 4px solid var(--accent-blue); color: var(--accent-blue); font-weight: 500;}
      .log-time { color: var(--text-muted); margin-bottom: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px;}

      /* Right: Root Cause */
      .root-cause-card { background: #FFF1F0; border: 1px solid #FFA39E; border-radius: var(--radius-md); padding: 16px; margin-bottom: 20px; animation: slideIn 0.3s ease-out;}
      .rc-title { color: var(--accent-red); font-weight: 700; margin-bottom: 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
      .rc-desc { font-size: 13px; color: var(--text-primary); line-height: 1.6; }
      #radar-chart { width: 100%; height: 280px; }
    </style>
</head>
<body>
    <!-- Consistent Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light" style="background: var(--bg-primary); border-bottom: 1px solid var(--border-subtle); height: 60px; display: flex; align-items: center; padding: 0; z-index: 1000;">
      <div class="container" style="max-width: 1600px; display: flex; justify-content: space-between; align-items: center;">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#" style="font-weight: 700; color: var(--text-primary); text-decoration: none; font-size: 1.25rem;">
          <span>⚙️ HNXX印务 · 多模态视觉智能质检</span>
        </a>
        <div>
          <a href="index.html" style="font-weight: 500; color: var(--text-primary); text-decoration: none; display: flex; align-items: center; gap: 4px; transition: color 0.3s;" onmouseover="this.style.color='#595959'" onmouseout="this.style.color='var(--text-primary)'">
            🏠 返回主页
          </a>
        </div>
      </div>
    </nav>

    <div id="root"></div>

    <!-- React & Babel & ECharts -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const generateLog = (type, message) => {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + 
                            now.getMinutes().toString().padStart(2, '0') + ':' + 
                            now.getSeconds().toString().padStart(2, '0') + '.' + 
                            now.getMilliseconds().toString().padStart(3, '0');
            return { id: Date.now() + Math.random(), time: timeStr, type, message };
        };

        const Dashboard = () => {
            const [logs, setLogs] = useState([
              generateLog('normal', '▶ 系统启动，多模态大模型权重加载完成。'),
              generateLog('normal', '▶ 开始实时监听高清工业相机数据流...')
            ]);
            const [defect, setDefect] = useState(null);
            const [beltRunning, setBeltRunning] = useState(true);
            const chartRef = useRef(null);

            // Simulation loop
            useEffect(() => {
                let interval;
                if (beltRunning) {
                    interval = setInterval(() => {
                        const rand = Math.random();
                        if (rand > 0.85) {
                            // Trigger Defect
                            const typeStr = Math.random() > 0.5 ? '0.1mm套印偏差' : '微小网点变形';
                            const newDefect = {
                                type: typeStr,
                                top: Math.random() * 50 + 20 + '%',
                                left: Math.random() * 50 + 20 + '%',
                                width: Math.random() * 60 + 60 + 'px',
                                height: Math.random() * 60 + 60 + 'px',
                            };
                            setDefect(newDefect);
                            
                            setLogs(prev => [generateLog('alert', `⚠️ 拦截异常特征：区域像素突变，模型判断为【${typeStr}】，触发联合诊断。`), ...prev].slice(0, 40));

                            // Pause belt to inspect
                            setBeltRunning(false);
                            
                            // Auto resume and Self-learn after 3.5s
                            setTimeout(() => {
                                setDefect(null);
                                setBeltRunning(true);
                                setLogs(prev => [generateLog('learning', `🔄 自我进化：模型已提取未知色差特征，完成零样本自适应学习 (Zero-shot)，免除人工标定。`), ...prev].slice(0, 40));
                            }, 3500);
                        } else {
                            // Normal
                            if(rand > 0.4) {
                                setLogs(prev => [generateLog('normal', '▶ 图像组提取成功，特征向量对比合规。'), ...prev].slice(0, 40));
                            }
                        }
                    }, 1200);
                }
                return () => clearInterval(interval);
            }, [beltRunning]);

            // ECharts radar visualization
            useEffect(() => {
                if (chartRef.current) {
                    const chart = echarts.init(chartRef.current);
                    const option = {
                        color: ['#003B73', '#c8102e'],
                        radar: {
                            indicator: [
                                { name: '滚筒温度', max: 100 },
                                { name: '印刷压力', max: 100 },
                                { name: '墨膜厚度', max: 100 },
                                { name: '纸张张力', max: 100 },
                                { name: '环境湿度', max: 100 },
                                { name: '套印精度', max: 100 }
                            ],
                            radius: '65%',
                            center: ['50%', '50%'],
                            axisName: { color: '#595959', fontSize: 11, fontWeight: 600 },
                            splitArea: { areaStyle: { color: ['#F8F9FA', '#ffffff'] } },
                            axisLine: { lineStyle: { color: '#e9ecef' } },
                            splitLine: { lineStyle: { color: '#e9ecef' } }
                        },
                        series: [{
                            type: 'radar',
                            data: [
                                {
                                    value: [42, 30, 80, 50, 60, 95],
                                    name: '基准运行参数',
                                    areaStyle: { color: 'rgba(0, 59, 115, 0.05)' },
                                    lineStyle: { width: 1, type: 'dashed' },
                                    symbol: 'none'
                                },
                                {
                                    value: defect ? [45, 92, 82, 55, 62, 35] : [42, 32, 78, 51, 60, 92],
                                    name: '实时 IoT 传感数据',
                                    areaStyle: { color: defect ? 'rgba(200, 16, 46, 0.15)' : 'rgba(0, 59, 115, 0.2)' },
                                    lineStyle: { width: 2 },
                                    symbolSize: 6
                                }
                            ]
                        }],
                        animationDuration: 500,
                    };
                    chart.setOption(option);

                    // Resize handler
                    const resizeObserver = new ResizeObserver(() => chart.resize());
                    resizeObserver.observe(chartRef.current);

                    return () => {
                        resizeObserver.disconnect();
                        chart.dispose();
                    };
                }
            }, [defect]);

            return (
                <div className="dashboard-container">
                    {/* Header */}
                    <header className="top-header">
                        <div className="d-flex align-items-center gap-4">
                            <div>
                                <h4 style={{margin:0, fontWeight:800, color:'var(--text-primary)', letterSpacing:'-0.5px'}}>小森S38轮转机</h4>
                                <span style={{fontSize:13, color:'var(--text-muted)', fontFamily:'var(--font-mono)'}}>NODE_ID: HNXX-PR-001</span>
                            </div>
                            <div className={`status-badge ${defect ? 'warning' : ''}`}>
                                <i className={`bi ${defect ? 'bi-shield-exclamation' : 'bi-shield-check'}`}></i>
                                {defect ? '拦截到缺陷，自适应调整中...' : '高速印刷中 - 状态良好'}
                            </div>
                        </div>
                        <div className="d-flex gap-5">
                            <div className="metric-box">
                                <div className="metric-value">55,000 <span style={{fontSize:14, fontWeight:500}}>份/h</span></div>
                                <div className="metric-label">当前设备节拍</div>
                            </div>
                            <div className="metric-box">
                                <div className="metric-value" style={{color: defect ? 'var(--accent-red)' : 'var(--accent-green)'}}>
                                    {defect ? '99.96%' : '99.98%'}
                                </div>
                                <div className="metric-label">实时良品率</div>
                            </div>
                            <div className="metric-box">
                                <div className="metric-value">{'< 0.02%'}</div>
                                <div className="metric-label">漏检率极限阈值</div>
                            </div>
                        </div>
                    </header>

                    {/* Main Grid */}
                    <div className="main-grid">
                        
                        {/* Left: AI Learning Stream */}
                        <div className="panel">
                            <div className="panel-header">
                                <span><i className="bi bi-cpu-fill me-2" style={{color:'var(--accent-blue)'}}></i>AI 特征流与自适应</span>
                                <span className="badge" style={{background:'rgba(0,59,115,0.1)', color:'var(--accent-blue)', fontWeight:700, border:'1px solid rgba(0,59,115,0.2)'}}>LIVE LOGS</span>
                            </div>
                            <div className="panel-body" style={{padding: 0, overflowX: 'hidden'}}>
                                {logs.map(log => (
                                    <div key={log.id} className={`log-item ${log.type}`}>
                                        <div className="log-time">{log.time}</div>
                                        <div>{log.message}</div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Center: Vision Viewport */}
                        <div className="panel" style={{background: 'var(--bg-secondary)'}}>
                            <div className="panel-header" style={{background: 'var(--bg-card)'}}>
                                <span><i className="bi bi-camera-video-fill me-2"></i>多模态实时视窗 (500fps 抽帧)</span>
                            </div>
                            <div className="vision-viewport">
                                {beltRunning && <div className="scan-line"></div>}
                                
                                <div className="vision-track" style={{ animation: beltRunning ? 'moveBelt 0.3s linear infinite' : 'none' }}>
                                    <div className="print-sheet"></div>
                                    <div className="print-sheet"></div>
                                    <div className="print-sheet"></div>
                                    <div className="print-sheet"></div>
                                </div>

                                {defect && (
                                    <div className="bounding-box" style={{top: defect.top, left: defect.left, width: defect.width, height: defect.height}}>
                                        <div className="bounding-label">{defect.type}</div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Right: Root Cause Brain */}
                        <div className="panel">
                            <div className="panel-header">
                                <span><i className="bi bi-diagram-3-fill me-2" style={{color:'var(--accent-blue)'}}></i>全局智脑与根因诊断</span>
                            </div>
                            <div className="panel-body">
                                {defect ? (
                                    <div className="root-cause-card">
                                        <div className="rc-title"><i className="bi bi-exclamation-triangle-fill"></i> 缺陷拦截与根因锁定</div>
                                        <div className="rc-desc">
                                            <strong>多维诊断结论：</strong><br/>
                                            关联底层 IoT 传感流发现，4号色组橡皮滚筒压力瞬间跃升至 <strong>92KPa</strong>，导致了【{defect.type}】的产生。<br/><br/>
                                            <strong>闭环干预策略：</strong><br/>
                                            已通过边缘网关下发微调指令，自动降低滚筒压力 0.02mm，无需人工停机。
                                        </div>
                                    </div>
                                ) : (
                                    <div style={{padding: 20, border: '1px dashed var(--border-subtle)', borderRadius: 'var(--radius-md)', color: 'var(--text-muted)', textAlign: 'center', marginBottom: 20, fontSize: 13, background: 'var(--bg-secondary)'}}>
                                        <i className="bi bi-activity fs-3 d-block mb-2 opacity-50"></i>
                                        系统持续计算视觉特征与底层 IoT 物理参数的皮尔逊相关系数...
                                    </div>
                                )}

                                <div style={{fontWeight: 700, fontSize: 14, marginBottom: 12, color: 'var(--text-primary)', borderBottom: '1px solid var(--border-subtle)', paddingBottom: 8}}>IoT 物理参数雷达矩阵</div>
                                <div id="radar-chart" ref={chartRef}></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
